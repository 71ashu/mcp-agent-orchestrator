[project]
name = "mcp-agent-orchestrator"
version = "0.1.0"
description = "An agentic runtime that discovers and orchestrates tools across multiple MCP servers to execute multi-step tasks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.6,<2",
    "anthropic>=0.40.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
orchestrator = "orchestrator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# BLE001/S110: recovery + memory paths are deliberately resilient to any failure.
# B008: typer's Argument/Option-in-defaults is the framework's intended usage.
ignore = ["BLE001", "S110", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["orchestrator"]
known-local-folder = ["conftest"]
